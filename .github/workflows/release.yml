name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # required for cosign OIDC signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_TOKEN is deliberately NOT exported any more: this repo
          # no longer publishes the `rvl` cask (see .goreleaser.yml), so the
          # release job has no reason to hold a PAT that can write to
          # revelara-ai/homebrew-tap. The repo secret itself is left in place —
          # it is the same secret name the new publisher uses, and deleting it
          # here would not help that repo, which needs its own copy.

      - uses: sigstore/cosign-installer@v3

      - name: Sign release checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            dist/checksums.txt
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.sig \
            --repo revelara-ai/rvl-cli --clobber
