name: Scanner Acceptance Test

on:
  pull_request:
    paths:
      - 'cmd/rvl/**'
      - 'internal/scanner/**'
      - 'internal/commands/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/scanner-acceptance.yml'
  push:
    branches:
      - main
      - 'feature/local-reliability-scanner'

jobs:
  acceptance:
    name: Phase 1 Acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run scanner acceptance test
        run: make scanner-acceptance
