version: 2

builds:
  - main: ./cmd/rvl
    binary: rvl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.gitHash={{.ShortCommit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: ["tar.gz"]
    name_template: "rvl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: revelara-ai
    name: rvl-cli
  draft: false
  prerelease: auto

# Homebrew: this repo NO LONGER publishes the `rvl` cask.
#
# `Casks/rvl.rb` in revelara-ai/homebrew-tap has exactly one publisher, and as
# of the rvl v2 cutover (po-av01j.154) that publisher is the Rust scanner repo
# — the one that takes over the `rvl-cli` name and ships `rvl` 1.x. It renders
# the cask itself from cargo-dist's dist-manifest.json
# (.github/workflows/publish-cask.yml + ci/render-cask.sh over there).
#
# If a `homebrew_casks:` block is ever restored here, both repos will race to
# write the same file in the tap and whichever released last wins — including
# an 0.12.x security patch silently downgrading brew users off 1.x. Don't.
#
# This repo is frozen to v1 security fixes; `goreleaser release` still builds
# and publishes archives, SBOMs and checksums to GitHub Releases as before, so
# the URLs already-published casks point at keep resolving.
